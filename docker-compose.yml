# Run the FCM POC stack in containers.
#
# Prerequisites (one-time, on the host):
#   cp .env.example .env                       # fill in Firebase config, VAPID key, DEV_SECRET
#   # place Firebase service account at server/serviceAccount.json
#   # edit the six REPLACE_ME values in web/public/firebase-messaging-sw.js
# Then: docker compose up
services:
  server:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync && uv run python -m src.main"
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - ./server:/app
      - server_venv:/app/.venv
      - ./.env:/.env:ro
      - ./server/serviceAccount.json:/app/serviceAccount.json:ro
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    env_file:
      - ./.env
    environment:
      - SENDER_URL=http://server:3000
      - DOCKER=1
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - ./.env:/.env:ro
      - ./web/public/firebase-messaging-sw.js:/app/public/firebase-messaging-sw.js:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_venv:
  web_node_modules:
